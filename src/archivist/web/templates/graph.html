{% extends "base.html" %}
{% block title %}Model Graph · Archivist{% endblock %}
{% block head_extra %}
<link rel="stylesheet" href="{{ url_for('static', filename='recommendation-map.css') }}?v={{ recommendation_map_css_version }}">
<link rel="stylesheet" href="{{ url_for('static', filename='graph-explorer.css') }}?v={{ graph_explorer_css_version }}">
<script defer src="{{ url_for('static', filename='recommendation-map.js') }}?v={{ recommendation_map_js_version }}"></script>
<script defer src="{{ url_for('static', filename='graph-explorer.js') }}?v={{ graph_explorer_js_version }}"></script>
{% endblock %}
{% block content %}
<div class="gx-explorer" id="graphExplorer" aria-label="模型图谱">
    <div class="gx-heading">
        <div><h1>模型图谱</h1></div>
        <span id="graphCount" class="gx-count" aria-live="polite">正在加载论文…</span>
    </div>
    <div class="gx-toolbar">
        <div class="gx-search-wrap">
            <label class="gx-sr-only" for="graphSearch">搜索模型名、论文标题或关键词</label>
            <span class="gx-search-icon" aria-hidden="true">⌕</span>
            <input id="graphSearch" type="search" placeholder="搜索模型、论文或关键词" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="graphSearchResults">
            <div id="graphSearchResults" class="gx-search-results" role="listbox" aria-label="搜索结果" hidden></div>
        </div>
        <label class="gx-topic-label"><span class="gx-sr-only">高亮主题标签</span><select id="graphTopic" aria-label="高亮主题标签"><option value="">全部标签</option></select></label>
        <button class="gx-button" id="graphOverview" type="button">全图</button>
    </div>
    <section class="gx-canvas-panel" aria-label="按发表时间排列的模型大图">
            <div id="graphCanvas" class="gx-canvas" role="region" aria-label="模型节点图，支持拖动、缩放与键盘选择"></div>
            <div id="graphLoading" class="gx-loading" role="status"><span>正在整理模型图谱…</span></div>
            <div class="gx-map-controls" aria-label="图谱缩放">
                <button id="graphZoomIn" type="button" aria-label="放大图谱">＋</button>
                <span id="graphZoom" aria-live="off">100%</span>
                <button id="graphZoomOut" type="button" aria-label="缩小图谱">−</button>
            </div>
    </section>
    <aside class="gx-inspector" id="graphInspector" aria-label="论文与相关研究" hidden>
            <div class="gx-inspector-top"><span id="graphPanelLabel"></span><button id="graphPanelClose" type="button" aria-label="关闭详情">×</button></div>
            <div id="graphPanelBody" class="gx-panel-body"></div>
    </aside>
    <noscript><p>请启用 JavaScript 查看交互图谱，也可前往 <a href="/reading/">论文列表</a>。</p></noscript>
</div>
{% endblock %}
