<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Archivist{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ css_version }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='article-content.css') }}?v={{ article_content_css_version }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='mailbox.css') }}?v={{ mailbox_css_version }}">
    <script defer src="{{ url_for('static', filename='mailbox.js') }}?v={{ mailbox_js_version }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='admin-auth.css') }}?v={{ admin_auth_css_version }}">
    <script defer src="{{ url_for('static', filename='admin-auth.js') }}?v={{ admin_auth_js_version }}"></script>
    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
        onload="renderMathInElement(document.body, {
            delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '$', right: '$', display: false}
            ],
            throwOnError: false
        });"></script>
    <script defer src="{{ url_for('static', filename='article-content.js') }}?v={{ article_content_js_version }}"></script>
    {% block head_extra %}{% endblock %}
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a href="/" class="logo"><span class="logo-emblem" aria-hidden="true">A</span>Archivist</a>
            <nav class="nav" aria-label="主导航">
                <a href="/reading/" class="nav-link {% if request.path.startswith('/reading') %}active{% endif %}">Paper Reading</a>
                <a href="/graph/" class="nav-link {% if request.path.startswith('/graph') %}active{% endif %}">Model Graph</a>
                <a href="/benchmark/" class="nav-link {% if request.path.startswith('/benchmark') %}active{% endif %}">Benchmarks</a>
            </nav>
        </div>
    </header>

    <main class="main">
        {% block content %}{% endblock %}
    </main>
    {% include '_mailbox.html' %}
    {% include '_admin_auth.html' %}
</body>
</html>
